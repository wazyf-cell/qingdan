# Gradle 守护进程的 JVM 参数。-Xmx8G 是这个工程当前用的堆上限：一次 release 构建
# 要同时跑 Kotlin 编译、desugaring、AOT 快照以及多个带原生代码的插件任务，堆不够时
# 表现为 "Java heap space" 或 "Gradle build daemon disappeared unexpectedly"。
# 物理内存不足 16 GB 的机器可以调低（例如 -Xmx4G -XX:MaxMetaspaceSize=2G），
# 代价是大工程偶发 OOM；这不是构建能否成功的开关，按自己机器改就行。
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 关闭 Kotlin 增量编译。**只有在项目与 pub 缓存跨盘/跨根路径时才需要它**：
# Windows 上项目在一个盘、PUB_CACHE 在另一个盘（默认在系统盘的用户目录里），
# Kotlin 增量缓存做相对路径计算时会抛 "this and base files have different roots"，
# 表现为某个插件任务失败（例如 :shared_preferences_android:compileDebugKotlin，
# 报错里带 "Could not close incremental caches in .../build/.../kotlin"）。
# 这里是按「关掉增量编译」治标：Kotlin 全量重编，构建变慢但结果稳定。
# 根治手段：把 PUB_CACHE 挪到与项目同一个盘，然后删掉下面这行恢复增量编译。
# 项目与缓存同盘的机器上，这行只是让构建慢一点，不影响正确性。
kotlin.incremental=false
